    <!-- Step 1 -->

      </div>

      <div class="tab-content active" id="tab-existing">

          <div class="spinner" style="display:block"></div>

        </div>
      </div>

        </div>

          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>

      <button class="btn btn-primary" id="uploadBtn" onclick="uploadZip()" disabled style="margin-top:16px">
        <svg viewBox="0 0 24 24" fill="currentColor" style="stroke:none;width:18px;height:18px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        <span id="uploadBtnText">رفع ونشر على GitHub</span>
        <div class="spinner" id="uploadSpinner"></div>
      </button>
    </div>
  </div>

  <script>
    const GH_ICON='<svg viewBox="0 0 24 24" fill="#a1a1aa" style="stroke:none;width:18px;height:18px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>';
    let selectedRepo = '';
    let selectedFile = null;
    let repos = [];

    // Session persistence
    const cachedUser=JSON.parse(localStorage.getItem('gitzip_user')||'null');
    if(cachedUser) applyUserData(cachedUser);

    function applyUserData(d){
      document.getElementById('userAvatar').src=d.avatar;
      document.getElementById('userName').textContent='@'+d.username;
      document.getElementById('userPill').style.display='flex';
      document.getElementById('dropdownAvatar').src=d.avatar;
      document.getElementById('dropdownName').textContent=d.name||d.username;
      document.getElementById('dropdownUser').textContent='@'+d.username;
      document.getElementById('githubProfileLink').href='https://github.com/'+d.username;
    }

    function toggleDropdown(e){
      e.stopPropagation();
      const dd=document.getElementById('accountDropdown'),pill=document.getElementById('userPill'),ov=document.getElementById('dropdownOverlay');
      const isOpen=dd.classList.contains('show');
      dd.classList.toggle('show',!isOpen);
      pill.classList.toggle('open',!isOpen);
      ov.classList.toggle('show',!isOpen);
    }
    function closeDropdown(){
      document.getElementById('accountDropdown').classList.remove('show');
      document.getElementById('userPill').classList.remove('open');
      document.getElementById('dropdownOverlay').classList.remove('show');
    }

    // Helper: fetch with auth check
    async function apiFetch(url, opts){
      const res = await fetch(url, opts);
      if(res.status===401){
        localStorage.removeItem('gitzip_user');
        window.location.href='/';
        throw new Error('auth');
      }
      return res.json();
    }

    // Also fetch fresh user data
    apiFetch('/api/me').then(d=>{
      localStorage.setItem('gitzip_user',JSON.stringify(d));
      applyUserData(d);
    }).catch(()=>{});

    const urlParams = new URLSearchParams(window.location.search);
    const preselectedRepo = urlParams.get('repo');

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      if (tab === 'existing') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('tab-existing').classList.add('active');
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('tab-new').classList.add('active');
      }
      updateUploadButton();
    }

    function renderRepoCards(list) {
      const container = document.getElementById('reposScroll');
      container.innerHTML = list.map(r => `
        <div class="repo-select-card ${selectedRepo === r.full_name ? 'selected' : ''}" onclick="selectRepo('${r.full_name}','${r.default_branch}')">
          <div class="rsc-icon">${GH_ICON}</div>
          <div class="rsc-info">
            <h4>${r.full_name}</h4>
            <p>${r.description || 'بدون وصف'}</p>
          </div>
          <span class="rsc-badge" style="background:${r.private ? 'rgba(124,58,237,0.08);color:#a78bfa;border:1px solid rgba(124,58,237,0.2)' : 'rgba(5,150,105,0.08);color:#34d399;border:1px solid rgba(5,150,105,0.2)'}">${r.private ? 'خاص' : 'عام'}</span>
        </div>
      `).join('');
    }

    function selectRepo(fullName, branch) {
      selectedRepo = fullName;
      if (branch) document.getElementById('branchName').value = branch;
      renderRepoCards(repos);
      updateUploadButton();
    }

    document.getElementById('repoSearch').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      renderRepoCards(repos.filter(r => r.full_name.toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q)));
    });

    async function loadRepos() {
      try {
        const data = await apiFetch('/api/github/repos');
        if (data.success) {
          repos = data.repos;
          renderRepoCards(repos);
          document.getElementById('repoLoading').style.display = 'none';
          document.getElementById('repoList').style.display = 'block';
          if (preselectedRepo) {
            const match = repos.find(r => r.full_name === preselectedRepo);
            if (match) selectRepo(match.full_name, match.default_branch);
          }
        } else {
          document.getElementById('repoLoading').innerHTML = '<p style="color:#fca5a5;">'+( data.message || 'فشل تحميل المستودعات')+'</p>';
        }
      } catch (err) {
        if(err.message==='auth') return;
        document.getElementById('repoLoading').innerHTML = '<p style="color:#fca5a5;">فشل تحميل المستودعات</p>';
      }
    }

    async function createRepo() {
      const name = document.getElementById('newRepoName').value.trim();
      if (!name) { showError('createRepoError', 'اسم المستودع مطلوب'); return; }
      const btn = document.getElementById('createRepoBtn');
      const spinner = document.getElementById('createRepoSpinner');
      const btnText = document.getElementById('createRepoBtnText');
      btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';
      hideMsg('createRepoError'); hideMsg('createRepoSuccess');

      try {
        const data = await apiFetch('/api/github/create-repo', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ name, description: document.getElementById('newRepoDesc').value.trim(), isPrivate: document.getElementById('newRepoPrivate').checked })
        });
        if (data.success) {
          selectedRepo = data.repo.full_name;
          document.getElementById('createRepoSuccess').innerHTML = 'تم انشاء المستودع <a href="https://github.com/'+data.repo.full_name+'" target="_blank">'+data.repo.full_name+'</a> بنجاح';
          document.getElementById('createRepoSuccess').style.display = 'block';
          if (data.repo.default_branch) document.getElementById('branchName').value = data.repo.default_branch;
          repos.unshift(data.repo);
          renderRepoCards(repos);
          updateUploadButton();
        } else {
          showError('createRepoError', data.message);
        }
      } catch (err) {
        showError('createRepoError', 'حدث خطأ اثناء انشاء المستودع');
      }
      btn.disabled = false; btnText.style.display = 'inline'; spinner.style.display = 'none';
    }

    // Drop zone
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', () => { if(fileInput.files.length) handleFile(fileInput.files[0]); });

    function handleFile(file) {
      if (!file.name.endsWith('.zip')) { showError('uploadError','يجب ان يكون الملف بصيغة ZIP'); return; }
      selectedFile = file;
      document.getElementById('fileName').textContent = file.name + ' (' + (file.size/1024/1024).toFixed(2) + ' MB)';
      hideMsg('uploadError');
      updateUploadButton();
    }

    function updateUploadButton() { document.getElementById('uploadBtn').disabled = !(selectedRepo && selectedFile); }

    async function uploadZip() {
      if (!selectedRepo || !selectedFile) return;
      const btn = document.getElementById('uploadBtn');
      const spinner = document.getElementById('uploadSpinner');
      const btnText = document.getElementById('uploadBtnText');
      btn.disabled = true; btnText.style.display = 'none'; spinner.style.display = 'block';
      hideMsg('uploadError'); hideMsg('uploadSuccess');
      const pc = document.getElementById('progressContainer');
      const pf = document.getElementById('progressFill');
      const pt = document.getElementById('progressText');
      pc.style.display = 'block'; pf.style.width = '10%'; pt.textContent = 'جاري رفع الملف وفك الضغط...';

      const formData = new FormData();
      formData.append('zipfile', selectedFile);
      formData.append('repoFullName', selectedRepo);
      formData.append('branch', document.getElementById('branchName').value.trim() || 'main');
      formData.append('commitMessage', document.getElementById('commitMessage').value.trim() || 'Upload via git-zip');

      let progress = 10;
      const iv = setInterval(() => {
        if (progress < 85) { progress += Math.random()*8; pf.style.width = progress+'%'; if(progress>30)pt.textContent='جاري نشر الملفات على GitHub...'; if(progress>60)pt.textContent='جاري انشاء الـ Commit...'; }
      }, 800);

      try {
        const data = await apiFetch('/api/upload', { method: 'POST', body: formData });
        clearInterval(iv); pf.style.width = '100%';
        if (data.success) {
          pt.textContent = 'تم بنجاح';
          const s = document.getElementById('uploadSuccess');
          s.innerHTML = 'تم رفع <strong>'+data.filesCount+'</strong> ملف بنجاح الى <a href="https://github.com/'+selectedRepo+'" target="_blank">'+selectedRepo+'</a><br><span style="color:#52525b;font-size:0.8rem">SHA: '+((data.commitSha||'').substring(0,7))+'</span>';
          s.style.display = 'block';
        } else {
          pc.style.display = 'none';
          showError('uploadError', data.message);
        }
      } catch (err) {
        clearInterval(iv); pc.style.display = 'none';
        showError('uploadError', 'حدث خطأ اثناء الرفع');
      }
      btn.disabled = false; btnText.style.display = 'inline'; spinner.style.display = 'none';
    }

    function showError(id, msg) { const el = document.getElementById(id); el.querySelector('span').textContent = msg; el.style.display = 'flex'; }
    function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

    loadRepos();
  </script>
</body>
</html>
