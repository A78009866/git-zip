<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - git-zip</title>
  <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      margin: 20px;
    }
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .logo-section h2 {
      color: #fff;
      font-size: 1.5rem;
    }
    .logo-section h2 span { color: #58a6ff; }
    .logo-section p { color: #8b949e; margin-top: 4px; font-size: 0.9rem; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #c9d1d9;
      font-size: 0.9rem;
      font-weight: 500;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #58a6ff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #58a6ff;
      color: #0a0a0a;
    }
    .btn-primary:hover {
      background: #79b8ff;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-msg {
      background: #f8514926;
      border: 1px solid #f8514966;
      color: #f85149;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8b949e;
    }
    .links a {
      color: #58a6ff;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #0a0a0a;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-section">
      <img src="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" alt="git-zip" class="logo">
      <h2>git<span>-zip</span></h2>
      <p>تسجيل الدخول إلى حسابك</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="btnText">تسجيل الدخول</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
    <div class="links">
      ليس لديك حساب؟ <a href="/register">إنشاء حساب جديد</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = data.message;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'حدث خطأ، حاول مرة أخرى';
        errorMsg.style.display = 'block';
      }

      btn.disabled = false;
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
    });
  </script>
</body>
</html>
