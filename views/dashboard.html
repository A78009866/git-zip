            عامة
          </div>
          <div class="stat-value" id="publicCount">--</div>
        </div>
      </div>

      <div class="section-header">
        <h3>المستودعات</h3>
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" id="searchInput" placeholder="بحث في المستودعات...">
        </div>
      </div>

      <div id="reposContainer" class="repos-grid"></div>
      <div id="emptyState" class="empty-state" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
        <p>لا توجد مستودعات</p>
      </div>
    </div>
  </div>

  <script>
    const GH_ICON='<svg viewBox="0 0 24 24" fill="#a1a1aa" style="stroke:none;width:18px;height:18px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>';
    const GH_ICON_SM='<svg viewBox="0 0 24 24" fill="currentColor" style="stroke:none;width:16px;height:16px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>';
    const langColors={JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219',Go:'#00ADD8',Rust:'#dea584',Ruby:'#701516',PHP:'#4F5D95',CSS:'#563d7c',HTML:'#e34c26',Shell:'#89e051',C:'#555555','C++':'#f34b7d','C#':'#178600',Swift:'#F05138',Kotlin:'#A97BFF',Dart:'#00B4AB',Vue:'#41b883',Svelte:'#ff3e00'};
    let allRepos=[];

    const cachedUser=JSON.parse(localStorage.getItem('gitzip_user')||'null');
    if(cachedUser){
      applyUserData(cachedUser);
      document.getElementById('loading').style.display='none';
      document.getElementById('content').style.display='block';
    }

    function applyUserData(d){
      document.getElementById('userAvatar').src=d.avatar;
      document.getElementById('userName').textContent='@'+d.username;
      document.getElementById('userPill').style.display='flex';
      document.getElementById('dropdownAvatar').src=d.avatar;
      document.getElementById('dropdownName').textContent=d.name||d.username;
      document.getElementById('dropdownUser').textContent='@'+d.username;
      document.getElementById('githubProfileLink').href='https://github.com/'+d.username;
    }

    function toggleDropdown(e){
      e.stopPropagation();
      const dd=document.getElementById('accountDropdown'),pill=document.getElementById('userPill'),ov=document.getElementById('dropdownOverlay');
      const isOpen=dd.classList.contains('show');
      dd.classList.toggle('show',!isOpen);
      pill.classList.toggle('open',!isOpen);
      ov.classList.toggle('show',!isOpen);
    }
    function closeDropdown(){
      document.getElementById('accountDropdown').classList.remove('show');
      document.getElementById('userPill').classList.remove('open');
      document.getElementById('dropdownOverlay').classList.remove('show');
    }

    function timeAgo(dateStr){
      const diff=Date.now()-new Date(dateStr).getTime();
      const mins=Math.floor(diff/60000);
      if(mins<60) return mins+' دقيقة';
      const hrs=Math.floor(mins/60);
      if(hrs<24) return hrs+' ساعة';
      const days=Math.floor(hrs/24);
      if(days<30) return days+' يوم';
      return Math.floor(days/30)+' شهر';
    }

    function renderRepos(repos){
      const container=document.getElementById('reposContainer');
      const empty=document.getElementById('emptyState');
      if(!repos.length){container.innerHTML='';empty.style.display='block';return;}
      empty.style.display='none';
      container.innerHTML=repos.map(r=>`
        <div class="repo-card" onclick="window.location.href='/upload?repo=${encodeURIComponent(r.full_name)}'">
          <a href="${r.html_url}" target="_blank" class="repo-link" onclick="event.stopPropagation()">${GH_ICON_SM}</a>
          <div class="repo-top">
            <div class="repo-name">${GH_ICON}<h4>${r.name}</h4></div>
            <span class="repo-badge ${r.private?'badge-private':'badge-public'}">${r.private?'خاص':'عام'}</span>
          </div>
          <p class="repo-desc">${r.description||'بدون وصف'}</p>
          <div class="repo-meta">
            ${r.language?`<div class="meta-item"><span class="lang-dot" style="background:${langColors[r.language]||'#71717a'}"></span>${r.language}</div>`:''}
            <div class="meta-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>${r.stargazers_count}</div>
            <div class="meta-item"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${timeAgo(r.updated_at)}</div>
          </div>
        </div>`).join('');
    }

    document.getElementById('searchInput').addEventListener('input',function(){
      const q=this.value.toLowerCase();
      renderRepos(allRepos.filter(r=>r.name.toLowerCase().includes(q)||(r.description||'').toLowerCase().includes(q)));
    });

    async function apiFetch(url, opts){
      try {
        const res = await fetch(url, opts);
        if(res.status===401){
          localStorage.removeItem('gitzip_user');
          window.location.href='/';
          throw new Error('auth');
        }
        return res.json();
      } catch(e) {
        if(e.message==='auth') throw e;
        throw new Error('network');
      }
    }

    async function init(){
      try{
        const[meRes,reposRes]=await Promise.all([
          apiFetch('/api/me'),
          apiFetch('/api/github/repos')
        ]);
        localStorage.setItem('gitzip_user',JSON.stringify(meRes));
        applyUserData(meRes);
        if(reposRes.success){
          allRepos=reposRes.repos;
          document.getElementById('repoCount').textContent=allRepos.length;
          document.getElementById('privateCount').textContent=allRepos.filter(r=>r.private).length;
          document.getElementById('publicCount').textContent=allRepos.filter(r=>!r.private).length;
          renderRepos(allRepos);
        }
        document.getElementById('loading').style.display='none';
        document.getElementById('content').style.display='block';
      }catch(err){
        if(err.message==='auth') return;
        // On network/other errors, show cached data instead of redirecting
        if(cachedUser){
          document.getElementById('loading').style.display='none';
          document.getElementById('content').style.display='block';
        } else {
          document.getElementById('loading').innerHTML='<p style="color:#fca5a5">فشل الاتصال بالخادم. <a href="/" style="color:#4ade80">اعادة المحاولة</a></p>';
        }
      }
    }
    init();

    // Theme management
    function toggleTheme(){
      const isLight=document.body.classList.toggle('light-mode');
      localStorage.setItem('gitzip_theme',isLight?'light':'dark');
      document.getElementById('themeToggle').checked=isLight;
    }
    function applyTheme(){
      const theme=localStorage.getItem('gitzip_theme');
      if(theme==='light'){
        document.body.classList.add('light-mode');
        document.getElementById('themeToggle').checked=true;
      }
    }
    applyTheme();
  </script>
  <footer>&copy; Aite.studio 2026</footer>
</body>
</html>
