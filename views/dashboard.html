<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - git-zip</title>
  <link rel="icon" href="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#09090b;color:#e4e4e7;min-height:100vh}
    .navbar{background:#09090b;border-bottom:1px solid #18181b;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;backdrop-filter:blur(12px)}
    .nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none}
    .nav-brand img{width:32px;height:32px;border-radius:8px}
    .nav-brand h1{font-size:1.2rem;color:#fafafa;font-weight:700}
    .nav-brand h1 span{color:#3b82f6}
    .nav-actions{display:flex;align-items:center;gap:16px}
    .user-pill{display:flex;align-items:center;gap:10px;background:#18181b;border:1px solid #27272a;border-radius:100px;padding:5px 16px 5px 6px}
    .user-pill img{width:28px;height:28px;border-radius:50%}
    .user-pill span{color:#a1a1aa;font-size:0.85rem;font-weight:500}
    .btn-logout{background:transparent;border:1px solid #27272a;color:#71717a;padding:8px 16px;border-radius:8px;font-size:0.8rem;cursor:pointer;transition:all .2s;text-decoration:none;font-weight:500}
    .btn-logout:hover{border-color:#3f3f46;color:#a1a1aa}
    .container{max-width:960px;margin:0 auto;padding:32px 24px}
    .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
    .page-header h2{font-size:1.5rem;color:#fafafa;font-weight:700}
    .btn-upload{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:#3b82f6;color:#fff;border-radius:10px;text-decoration:none;font-size:0.9rem;font-weight:600;transition:all .25s;border:none;cursor:pointer}
    .btn-upload:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,130,246,0.25)}
    .btn-upload svg{width:18px;height:18px}
    /* Stats */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:36px}
    @media(max-width:640px){.stats{grid-template-columns:1fr}}
    .stat-card{background:#111113;border:1px solid #1c1c1f;border-radius:14px;padding:24px}
    .stat-card .stat-label{color:#52525b;font-size:0.8rem;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .stat-card .stat-label svg{width:16px;height:16px;stroke:#52525b}
    .stat-card .stat-value{color:#fafafa;font-size:1.6rem;font-weight:700}
    /* Repos */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .section-header h3{color:#a1a1aa;font-size:0.9rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
    .search-box{display:flex;align-items:center;gap:8px;background:#111113;border:1px solid #27272a;border-radius:8px;padding:8px 14px;width:260px}
    .search-box svg{width:16px;height:16px;stroke:#52525b;flex-shrink:0}
    .search-box input{background:none;border:none;outline:none;color:#e4e4e7;font-size:0.85rem;width:100%}
    .search-box input::placeholder{color:#3f3f46}
    .repos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:700px){.repos-grid{grid-template-columns:1fr}}
    .repo-card{background:#111113;border:1px solid #1c1c1f;border-radius:14px;padding:22px;transition:all .25s;cursor:pointer;position:relative;overflow:hidden}
    .repo-card:hover{border-color:#27272a;transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,0.3)}
    .repo-card.selected{border-color:#3b82f6;box-shadow:0 0 0 1px #3b82f6}
    .repo-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
    .repo-name{display:flex;align-items:center;gap:8px}
    .repo-name svg{width:18px;height:18px;stroke:#3b82f6;flex-shrink:0}
    .repo-name h4{color:#fafafa;font-size:0.95rem;font-weight:600}
    .repo-badge{padding:3px 10px;border-radius:100px;font-size:0.7rem;font-weight:600}
    .badge-private{background:#7c3aed15;color:#a78bfa;border:1px solid #7c3aed33}
    .badge-public{background:#05966915;color:#34d399;border:1px solid #05966933}
    .repo-desc{color:#52525b;font-size:0.82rem;line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .repo-meta{display:flex;align-items:center;gap:16px}
    .meta-item{display:flex;align-items:center;gap:5px;color:#3f3f46;font-size:0.75rem}
    .meta-item svg{width:14px;height:14px}
    .lang-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
    .repo-link{position:absolute;top:22px;left:22px;color:#3f3f46;transition:color .2s}
    .repo-link:hover{color:#a1a1aa}
    .repo-link svg{width:16px;height:16px}
    /* Loading */
    #loading{text-align:center;padding:60px;color:#52525b}
    .spinner{width:36px;height:36px;border:3px solid #18181b;border-top:3px solid #3b82f6;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state{text-align:center;padding:60px 20px;color:#3f3f46}
    .empty-state svg{width:48px;height:48px;stroke:#27272a;margin-bottom:16px}
    .empty-state p{font-size:0.9rem}
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/dashboard" class="nav-brand">
      <img src="https://res.cloudinary.com/duixjs8az/image/upload/v1765127215/post_media/1765127215249-trimer.jpg" alt="git-zip">
      <h1>git<span>-zip</span></h1>
    </a>
    <div class="nav-actions">
      <div class="user-pill" id="userPill" style="display:none">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
      </div>
      <a href="/api/logout" class="btn-logout">تسجيل خروج</a>
    </div>
  </nav>

  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <p>جاري التحميل...</p>
    </div>

    <div id="content" style="display:none">
      <div class="page-header">
        <h2>لوحة التحكم</h2>
        <a href="/upload" class="btn-upload">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
          رفع ملف ZIP
        </a>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
            المستودعات
          </div>
          <div class="stat-value" id="repoCount">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
            خاصة
          </div>
          <div class="stat-value" id="privateCount">--</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/></svg>
            عامة
          </div>
          <div class="stat-value" id="publicCount">--</div>
        </div>
      </div>

      <div class="section-header">
        <h3>المستودعات</h3>
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input type="text" id="searchInput" placeholder="بحث في المستودعات...">
        </div>
      </div>

      <div id="reposContainer" class="repos-grid"></div>
      <div id="emptyState" class="empty-state" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
        <p>لا توجد مستودعات</p>
      </div>
    </div>
  </div>

  <script>
    const langColors = {JavaScript:'#f1e05a',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219',Go:'#00ADD8',Rust:'#dea584',Ruby:'#701516',PHP:'#4F5D95',CSS:'#563d7c',HTML:'#e34c26',Shell:'#89e051',C:'#555555','C++':'#f34b7d','C#':'#178600',Swift:'#F05138',Kotlin:'#A97BFF',Dart:'#00B4AB',Vue:'#41b883',Svelte:'#ff3e00'};
    let allRepos = [];

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return mins + ' دقيقة';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + ' ساعة';
      const days = Math.floor(hrs / 24);
      if (days < 30) return days + ' يوم';
      return Math.floor(days / 30) + ' شهر';
    }

    function renderRepos(repos) {
      const container = document.getElementById('reposContainer');
      const empty = document.getElementById('emptyState');
      if (repos.length === 0) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';
      container.innerHTML = repos.map(r => `
        <div class="repo-card" onclick="window.location.href='/upload?repo=${encodeURIComponent(r.full_name)}'">
          <a href="${r.html_url}" target="_blank" class="repo-link" onclick="event.stopPropagation()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
          </a>
          <div class="repo-top">
            <div class="repo-name">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
              <h4>${r.name}</h4>
            </div>
            <span class="repo-badge ${r.private ? 'badge-private' : 'badge-public'}">${r.private ? 'خاص' : 'عام'}</span>
          </div>
          <p class="repo-desc">${r.description || 'بدون وصف'}</p>
          <div class="repo-meta">
            ${r.language ? `<div class="meta-item"><span class="lang-dot" style="background:${langColors[r.language] || '#71717a'}"></span>${r.language}</div>` : ''}
            <div class="meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
              ${r.stargazers_count}
            </div>
            <div class="meta-item">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              ${timeAgo(r.updated_at)}
            </div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      renderRepos(allRepos.filter(r => r.name.toLowerCase().includes(q) || (r.description || '').toLowerCase().includes(q)));
    });

    async function init() {
      try {
        const [meRes, reposRes] = await Promise.all([
          fetch('/api/me').then(r => r.json()),
          fetch('/api/github/repos').then(r => r.json())
        ]);

        document.getElementById('userAvatar').src = meRes.avatar;
        document.getElementById('userName').textContent = '@' + meRes.username;
        document.getElementById('userPill').style.display = 'flex';

        if (reposRes.success) {
          allRepos = reposRes.repos;
          document.getElementById('repoCount').textContent = allRepos.length;
          document.getElementById('privateCount').textContent = allRepos.filter(r => r.private).length;
          document.getElementById('publicCount').textContent = allRepos.filter(r => !r.private).length;
          renderRepos(allRepos);
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (err) {
        window.location.href = '/';
      }
    }
    init();
  </script>
</body>
</html>
