<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - git-zip</title>
  <link rel="icon" href="https://ik.imagekit.io/Aite/post_media/1775677384191-1000126675_-DAThYlRs.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      margin: 20px;
    }
    .logo-section {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .logo-section h2 {
      color: #fff;
      font-size: 1.5rem;
    }
    .logo-section h2 span { color: #58a6ff; }
    .logo-section p { color: #8b949e; margin-top: 4px; font-size: 0.9rem; }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #c9d1d9;
      font-size: 0.9rem;
      font-weight: 500;
    }
    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #58a6ff;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #58a6ff;
      color: #0a0a0a;
    }
    .btn-primary:hover {
      background: #79b8ff;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error-msg {
      background: #f8514926;
      border: 1px solid #f8514966;
      color: #f85149;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
    }
    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #8b949e;
    }
    .links a {
      color: #58a6ff;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid #0a0a0a;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Light Mode */
    body.light-mode{background:#f5f5f5;color:#1a1a1a}
    body.light-mode .card{background:#fff;border:1px solid rgba(0,0,0,0.1);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
    body.light-mode .logo-section h2{color:#1a1a1a}
    body.light-mode .logo-section h2 span{color:#3b82f6}
    body.light-mode .logo-section p{color:#71717a}
    body.light-mode label{color:#374151}
    body.light-mode input[type="email"],body.light-mode input[type="password"],body.light-mode input[type="text"]{background:#f9fafb;border:1px solid rgba(0,0,0,0.12);color:#1a1a1a}
    body.light-mode input:focus{border-color:#3b82f6}
    body.light-mode .btn-primary{background:#3b82f6;color:#fff}
    body.light-mode .btn-primary:hover{background:#2563eb}
    body.light-mode .error-msg{background:rgba(220,38,38,0.06);border-color:rgba(220,38,38,0.2);color:#dc2626}
    body.light-mode .links{color:#71717a}
    body.light-mode .links a{color:#3b82f6}
    body.light-mode .spinner{border-color:#fff;border-top-color:transparent}
    @media(max-width:600px){
      .card{padding:28px 22px;margin:16px}
      .logo{width:52px;height:52px}
      .logo-section h2{font-size:1.3rem}
      .logo-section p{font-size:0.82rem}
      input[type="email"],input[type="password"],input[type="text"]{padding:11px 14px;font-size:0.92rem}
      .btn{padding:12px;font-size:0.92rem}
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-section">
      <img src="https://ik.imagekit.io/Aite/post_media/1775677384191-1000126675_-DAThYlRs.webp" alt="git-zip" class="logo">
      <h2>git<span>-zip</span></h2>
      <p>إنشاء حساب جديد</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="registerForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" required placeholder="username">
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">
        <span id="btnText">إنشاء حساب</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
    <div class="links">
      لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = data.message;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'حدث خطأ، حاول مرة أخرى';
        errorMsg.style.display = 'block';
      }

      btn.disabled = false;
      btnText.style.display = 'inline';
      spinner.style.display = 'none';
    });
  </script>
  <script>
    (function(){
      const theme=localStorage.getItem('gitzip_theme');
      if(theme==='light') document.body.classList.add('light-mode');
    })();
  </script>
</body>
</html>
